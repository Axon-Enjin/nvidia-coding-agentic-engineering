<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title description">
  <title id="title">A private note and two requests</title>
  <desc id="description">Alice owns a note. The illustration asks what happens when Bob requests that same note.</desc>
  <rect width="720" height="520" fill="#eef1eb"/>
  <path d="M35 37h650M35 483h650" stroke="#cbd3ca"/>
  <text x="35" y="25" fill="#59685d" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">ACCESS STUDY / 01</text>
  <text x="685" y="25" text-anchor="end" fill="#59685d" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">SYNTHETIC EXAMPLE</text>

  <rect x="255" y="92" width="234" height="322" rx="3" fill="#d8dfd5" transform="translate(10 11)"/>
  <path d="M255 92h182l52 52v270H255z" fill="#fffefb" stroke="#aab8ad" stroke-width="1.5"/>
  <path d="M437 92v52h52" fill="#e4eae1" stroke="#aab8ad" stroke-width="1.5"/>
  <text x="281" y="127" fill="#577261" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">NOTE 001</text>
  <path d="M281 146h182" stroke="#d3ddd2"/>
  <text x="281" y="190" fill="#20352b" font-family="Georgia, serif" font-size="27">Alice’s note</text>
  <path d="M281 213h176M281 240h159M281 267h172M281 294h119" stroke="#c8d3c9" stroke-width="2" stroke-linecap="round"/>
  <path d="M281 345h182" stroke="#d3ddd2"/>
  <text x="281" y="372" fill="#526459" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">OWNER</text>
  <text x="463" y="373" text-anchor="end" fill="#20352b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Alice</text>

  <circle cx="100" cy="219" r="23" fill="#d8e8d8" stroke="#71947d"/>
  <text x="100" y="225" text-anchor="middle" fill="#234936" font-family="Arial, sans-serif" font-size="16" font-weight="700">A</text>
  <text x="138" y="215" fill="#20352b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Alice</text>
  <text x="138" y="234" fill="#59685d" font-family="Arial, sans-serif" font-size="12">the owner</text>
  <path d="M198 219h57" stroke="#648a6d" stroke-width="2"/>
  <circle cx="255" cy="219" r="4" fill="#648a6d"/>

  <circle cx="621" cy="315" r="23" fill="#e5e8e2" stroke="#98a69a"/>
  <text x="621" y="321" text-anchor="middle" fill="#45564b" font-family="Arial, sans-serif" font-size="16" font-weight="700">B</text>
  <text x="580" y="311" text-anchor="end" fill="#20352b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Bob</text>
  <text x="580" y="330" text-anchor="end" fill="#59685d" font-family="Arial, sans-serif" font-size="12">another user</text>
  <path d="M549 315h-60" stroke="#98a69a" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="489" cy="315" r="12" fill="#eef1eb" stroke="#98a69a"/>
  <text x="489" y="320" text-anchor="middle" fill="#526459" font-family="Georgia, serif" font-size="15">?</text>

  <text x="35" y="505" fill="#59685d" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">WHO CAN READ IT?</text>
  <text x="685" y="505" text-anchor="end" fill="#59685d" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">RUN THE CHECK TO FIND OUT</text>
</svg>
